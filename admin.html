<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
    <section class="card" id="login-card">
        <h1>Админ-панель</h1>

        <form id="login-form">
            <label>
                Логин
                <input id="username" type="text" required>
            </label>

            <br>

            <label>
                Пароль
                <input id="password" type="password" required>
            </label>

            <button type="submit">Войти</button>
        </form>

        <div id="login-message" class="message"></div>
    </section>

    <section class="card" id="admin-card" hidden>
        <h1>Администрирование</h1>
        <button type="button" onclick="logout()">Выйти</button>

        <hr>

        <h2>Создать голосование</h2>

        <form id="create-form">
            <label>
                Название
                <input id="poll-title" type="text" maxlength="200" required>
            </label>

            <br>

            <label>
                Описание
                <input id="poll-description" type="text" maxlength="500">
            </label>

            <br>

            <label>
                Варианты ответа
                <textarea
                    id="poll-options"
                    rows="8"
                    style="width:100%; margin-top:8px;"
                    placeholder="Первый вариант&#10;Второй вариант&#10;Третий вариант"
                    required></textarea>
            </label>

            <br>

            <label>
                <input id="multiple-choice" type="checkbox">
                Разрешить выбирать несколько вариантов
            </label>

            <br>

            <label>
                Срок действия
                <select id="poll-duration">
                    <option value="0">Бессрочно</option>
                    <option value="5">5 минут</option>
                    <option value="15">15 минут</option>
                    <option value="30">30 минут</option>
                    <option value="60">1 час</option>
                    <option value="360">6 часов</option>
                    <option value="1440">24 часа</option>
                    <option value="10080">7 дней</option>
                    <option value="custom">Своя дата</option>
                </select>
            </label>

            <div id="custom-expiry-wrap" hidden>
                <label>
                    Дата и время окончания
                    <input id="custom-expiry" type="datetime-local">
                </label>
            </div>

            <br>

            <button type="submit">Создать голосование</button>
        </form>

        <div id="create-message" class="message"></div>

        <hr>

        <h2>Голосования</h2>
        <div id="polls"></div>
    </section>
</main>

<script>
const API = "https://voting-worker.wop099map.workers.dev";
let token = localStorage.getItem("admin_token");

const loginCard = document.getElementById("login-card");
const adminCard = document.getElementById("admin-card");
const durationSelect = document.getElementById("poll-duration");
const customExpiryWrap = document.getElementById("custom-expiry-wrap");

durationSelect.addEventListener("change", () => {
    customExpiryWrap.hidden = durationSelect.value !== "custom";
});

function showAdmin() {
    if (!token) {
        loginCard.hidden = false;
        adminCard.hidden = true;
        return;
    }

    loginCard.hidden = true;
    adminCard.hidden = false;
    loadPolls();
}

async function api(path, options = {}) {
    options.headers = {
        ...(options.headers || {}),
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json"
    };

    const response = await fetch(`${API}${path}`, options);

    if (response.status === 401) {
        logout();
        throw new Error("Сессия закончилась");
    }

    let data = {};
    try {
        data = await response.json();
    } catch {
        throw new Error(`HTTP ${response.status}`);
    }

    if (!response.ok) {
        throw new Error(data.error || `HTTP ${response.status}`);
    }

    return data;
}

document.getElementById("login-form").addEventListener("submit", async event => {
    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const message = document.getElementById("login-message");

    try {
        const response = await fetch(`${API}/api/admin/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
            message.textContent = data.error || "Ошибка входа";
            return;
        }

        token = data.token;
        localStorage.setItem("admin_token", token);
        message.textContent = "";
        showAdmin();
    } catch (error) {
        console.error(error);
        message.textContent = "Ошибка подключения";
    }
});

document.getElementById("create-form").addEventListener("submit", async event => {
    event.preventDefault();

    const message = document.getElementById("create-message");

    const title = document.getElementById("poll-title").value.trim();
    const description = document.getElementById("poll-description").value.trim();

    const options = document.getElementById("poll-options").value
        .split("\n")
        .map(x => x.trim())
        .filter(Boolean);

    if (options.length < 2) {
        message.textContent = "Нужно минимум 2 варианта.";
        return;
    }

    const multipleChoice =
        document.getElementById("multiple-choice").checked;

    let expiresAt = null;

    if (durationSelect.value === "custom") {
        const custom = document.getElementById("custom-expiry").value;

        if (!custom) {
            message.textContent = "Укажите дату окончания.";
            return;
        }

        expiresAt = new Date(custom).toISOString();

        if (new Date(expiresAt) <= new Date()) {
            message.textContent = "Дата окончания должна быть в будущем.";
            return;
        }
    } else {
        const minutes = Number(durationSelect.value);

        if (minutes > 0) {
            expiresAt = new Date(
                Date.now() + minutes * 60 * 1000
            ).toISOString();
        }
    }

    try {
        const result = await api("/api/admin/polls", {
            method: "POST",
            body: JSON.stringify({
                title,
                description,
                options,
                multiple_choice: multipleChoice,
                expires_at: expiresAt
            })
        });

        message.textContent =
            result.error || "Голосование создано";

        document.getElementById("create-form").reset();
        customExpiryWrap.hidden = true;

        await loadPolls();
    } catch (error) {
        console.error(error);
        message.textContent =
            error.message || "Не удалось создать голосование";
    }
});

async function loadPolls() {
    const container = document.getElementById("polls");

    try {
        const data = await api("/api/admin/polls");

        container.innerHTML = "";

        if (!data.polls || !data.polls.length) {
            container.innerHTML = "<p>Голосований пока нет.</p>";
            return;
        }

        for (const poll of data.polls) {
            const element = document.createElement("div");
            element.className = "option";

            const multiple =
                Boolean(
                    poll.multiple_choice ??
                    poll.allow_multiple ??
                    poll.multi_choice
                );

            const expiresAt =
                poll.expires_at || poll.expiresAt || null;

            let expiryText = "";

            if (expiresAt) {
                const date = new Date(expiresAt);

                if (!Number.isNaN(date.getTime())) {
                    expiryText =
                        `<p>Окончание: ${escapeHtml(
                            date.toLocaleString("ru-RU")
                        )}</p>`;
                }
            }

            element.innerHTML = `
                <div style="width:100%">
                    <strong>${escapeHtml(poll.title)}</strong>

                    <p>
                        Статус:
                        ${poll.active ? "🟢 активно" : "⚪ закрыто"}
                    </p>

                    <p>
                        Тип:
                        ${multiple
                            ? "☑ множественный выбор"
                            : "◉ один вариант"}
                    </p>

                    ${expiryText}

                    <button
                        type="button"
                        onclick="results(${Number(poll.id)})">
                        Результаты
                    </button>

                    ${poll.active ? `
                        <button
                            type="button"
                            onclick="closePoll(${Number(poll.id)})">
                            Закрыть
                        </button>
                    ` : ""}

                    <button
                        type="button"
                        onclick="deletePoll(${Number(poll.id)}, '${escapeJs(poll.title)}')">
                        Удалить
                    </button>

                    <div id="results-${Number(poll.id)}"></div>
                </div>
            `;

            container.appendChild(element);
        }
    } catch (error) {
        console.error(error);
        container.innerHTML =
            `<p>Не удалось загрузить голосования: ${escapeHtml(error.message)}</p>`;
    }
}

async function results(id) {
    try {
        const data = await api(`/api/admin/results?poll_id=${id}`);
        const container = document.getElementById(`results-${id}`);

        let html =
            `<p><strong>Всего голосов: ${Number(data.total || 0)}</strong></p>`;

        for (const row of (data.results || [])) {
            const percent = Number(data.total) > 0
                ? (Number(row.votes) / Number(data.total) * 100).toFixed(1)
                : "0.0";

            html += `
                <p>
                    ${escapeHtml(row.text)}
                    — ${Number(row.votes)} (${percent}%)
                </p>
            `;
        }

        container.innerHTML = html;
    } catch (error) {
        alert(error.message || "Не удалось получить результаты.");
    }
}

async function closePoll(id) {
    if (!confirm("Закрыть это голосование?")) {
        return;
    }

    try {
        await api("/api/admin/close", {
            method: "POST",
            body: JSON.stringify({ poll_id: id })
        });

        await loadPolls();
    } catch (error) {
        alert(error.message || "Не удалось закрыть голосование.");
    }
}

async function deletePoll(id, title) {
    const confirmed = confirm(
        `Удалить голосование "${title}"?\n\n` +
        `Будут удалены:\n` +
        `• само голосование\n` +
        `• все варианты ответа\n` +
        `• все голоса\n\n` +
        `Это действие невозможно отменить.`
    );

    if (!confirmed) {
        return;
    }

    try {
        await api("/api/admin/delete", {
            method: "POST",
            body: JSON.stringify({
                poll_id: id
            })
        });

        await loadPolls();
    } catch (error) {
        alert(error.message || "Не удалось удалить голосование.");
    }
}

function logout() {
    token = null;
    localStorage.removeItem("admin_token");
    showAdmin();
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeJs(value) {
    return String(value)
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'")
        .replaceAll("\r", "\\r")
        .replaceAll("\n", "\\n");
}

showAdmin();
</script>
</body>
</html>
